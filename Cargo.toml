[package]
name = "tmux-flash"
version = "0.2.0"
edition = "2024"
description = "Jump labels for tmux panes, with the rules of flash.nvim"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Leandros/tmux-flash"
readme = "README.md"
keywords = ["tmux", "flash", "jump", "labels", "terminal"]
categories = ["command-line-utilities"]
# The crate holds what builds and tests it; no CI or editor files.
include = [
    "/src",
    "/tests",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/clippy.toml",
    "/rustfmt.toml",
]
publish = true

# cargo-binstall: the release archives of .github/workflows/release.yml. On
# Linux there are only musl builds; binstall tries them after the gnu target.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
crossterm = "0.29.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_results = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Items are pub(crate) to state their visibility (unreachable_pub); this
# nursery lint asks for the opposite.
redundant_pub_crate = "allow"
# Restriction lints: no panics outside tests, no lossy casts, no byte
# slicing of UTF-8 text, no stray output.
as_conversions = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
